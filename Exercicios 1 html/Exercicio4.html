<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

        <form method="post" id="contato" action="obrigado.html">
    <fieldset id="ident_dono">
        <legend>identificação do novo animal</legend>


<p> <label for="nome_dono">Nome:</label> 
    <input type="text" name="nome_dono" maxlength="100" id="nome_dono" size = "50" 
    placeholder="Digite o nome completo do dono do animal"/>
</p>

<p><label for="endereco">Endereço:</label> 
    <input type="text" name="endereco" id="endereco" size = "80" 
    placeholder="Digite o endereço" maxlength="60"/>
</p>

<p><label for="cep">CEP:</label> 
    <input type="text" name="cep" id="cep" maxlength="9" size = "10"  placeholder="XXXXX-XXX"/></p>

<p><label for="email_dono">Email:</label> 
    <input type="email" name="email_dono" maxlength="60" id="email_dono" size = "80"  
    placeholder="Digite o endereço de email"> 
</p> 

<p><label for="tel_dono">Tel/Cel:</label> 
    <input type="text" name="tel_dono" maxlength="13" id="tel_dono" size = "12" 
    placeholder="99 99999-9999"/>
</p>

<p><label for="nome_animal">idade:</label> 
    <input type="text" name="nome_animal" max="40" id="nome_animal"  size = "25" 
     placeholder="Digite a idade"/>


    
</body>
</html>
