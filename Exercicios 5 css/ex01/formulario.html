<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title> Formulário organizado </title>

</head>
<style>
  body{
    width: 800px; 
    margin-top: auto;
    margin-bottom: auto;
    margin-left: 200;
    margin-right: 200;
  }
  form {
    margin: 30px 0;
    background: url(form1_back.jpg) no-repeat  ;  
    padding-left:80px;    
  }
  h1{
    color: blueviolet;
    text-align: right;
    border-bottom: solid;
  }   
  fieldset{
    border-color: pink;
  }
  input{
    background-color: pink;
    border: none;
    width: 570px;
  }

  textarea{
    background-color: pink;
    border: none;
    width: 570px;
  }
  input[type="submit"]{
    background-color: pink;
    border: none;
    width: 100px;
  }
  label{
      display: inline-block;
      width: 80px;
      

  }

  

 
</style>

<body>

<h1>Dados da conta</h1>

<form action="" method="post" name="form">
  
  <input type="hidden" name="deOnde" value="form organizado">
  
  <fieldset> 
  <legend> Dados Pessoais: </legend>
  <p>
    <label for="nome"> Nome: </label>
    <input type="text" name="nome" id="nome"></p>
    
  <p>
    <label for="email"> Email: </label>
    <input type="text" name="email" id="email"></p>
  </fieldset>
  
  <fieldset> 
  <legend> Dados da Conta: </legend>  
  <p>
    <label for="senha">Senha:</label>
    <input type="password" name="senha" id="senha"></p>
    
  <p>
    <label for="frase"> Frase opcional: </label>
    <textarea name="frase" id="frase"></textarea></p>
    
  </fieldset>
  <p>
    <input type="submit" value="enviar"></p>
</form>

</body>
</html>
